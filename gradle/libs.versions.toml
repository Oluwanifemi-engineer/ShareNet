[versions]
agp = "8.10.1"
kotlin = "2.0.21"
coreKtx = "1.13.0"
appcompat = "1.6.1"
material = "1.12.0"
zxing = "3.5.3"
sentry = "8.49.0"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# sentry-android-core only (not the full sentry-android wrapper): the app
# is pure Kotlin, so the NDK crash handler and replay (screen recording)
# would add ~3MB of native libs for zero benefit — and replay would be a
# privacy problem for a relay app.
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
